<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant Atos</title>

  <!-- ==================== 1. LE STYLE (CSS) ==================== -->
  <style>
    :root {
      --fond: #f7f7f8;          --carte: #ffffff;
      --texte: #1f2328;         --texte-doux: #6b7280;
      --bordure: #e5e7eb;       --accent: #1f5fae;
      --bulle-user: #1f5fae;    --texte-user: #ffffff;
      --outil: #eef4fb;
    }
    @media (prefers-color-scheme: dark) {   /* thème sombre automatique */
      :root {
        --fond: #16181d;        --carte: #1f2229;
        --texte: #e8eaed;       --texte-doux: #9aa0a6;
        --bordure: #2e323b;     --accent: #6ea8fe;
        --bulle-user: #2b5ea8;  --outil: #232a36;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fond); color: var(--texte);
    }

    /* En-tête */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid var(--bordure); background: var(--carte);
    }
    header h1 { font-size: 17px; margin: 0; }
    header h1 span { color: var(--accent); }
    button { font: inherit; cursor: pointer; }
    #nouvelle {
      border: 1px solid var(--bordure); background: transparent; color: var(--texte);
      border-radius: 8px; padding: 7px 12px; font-size: 14px;
    }
    #nouvelle:hover { background: var(--fond); }

    /* Zone des messages */
    main { flex: 1; overflow-y: auto; padding: 24px 16px; }
    #conversation { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .message { display: flex; gap: 10px; align-items: flex-start; }
    .message.user { justify-content: flex-end; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 13px; font-weight: 700;
      background: var(--accent); color: #fff;
    }
    .bulle { line-height: 1.55; max-width: 85%; white-space: normal; word-wrap: break-word; }
    .user .bulle {
      background: var(--bulle-user); color: var(--texte-user);
      padding: 10px 14px; border-radius: 18px 18px 4px 18px;
    }
    .assistant .bulle { padding-top: 4px; }
    .bulle p { margin: 0 0 8px; }
    .bulle p:last-child { margin-bottom: 0; }
    .erreur .bulle { color: #c0392b; }

    /* Les outils utilisés par l'agent */
    .outils { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .outils details {
      background: var(--outil); border-radius: 8px; padding: 6px 10px; font-size: 13px;
    }
    .outils summary { cursor: pointer; color: var(--texte-doux); }
    .outils pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 12px; }

    /* Les trois points "l'assistant réfléchit" */
    .points span {
      display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%;
      background: var(--texte-doux); animation: saut 1.2s infinite;
    }
    .points span:nth-child(2) { animation-delay: .15s; }
    .points span:nth-child(3) { animation-delay: .3s; }
    @keyframes saut { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

    /* Écran d'accueil */
    #accueil { text-align: center; margin-top: 12vh; }
    #accueil h2 { font-size: 26px; margin-bottom: 6px; }
    #accueil p { color: var(--texte-doux); margin-top: 0; }
    #suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
    #suggestions button {
      border: 1px solid var(--bordure); background: var(--carte); color: var(--texte);
      border-radius: 12px; padding: 10px 14px; font-size: 14px; max-width: 260px;
    }
    #suggestions button:hover { border-color: var(--accent); }

    /* Zone de saisie */
    footer { padding: 12px 16px 18px; }
    form {
      max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
      background: var(--carte); border: 1px solid var(--bordure); border-radius: 16px; padding: 8px 8px 8px 14px;
    }
    textarea {
      flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--texte);
      font: inherit; font-size: 15px; line-height: 1.4; max-height: 160px; padding: 6px 0;
    }
    #envoyer {
      border: none; border-radius: 10px; width: 38px; height: 38px;
      background: var(--accent); color: #fff; font-size: 18px;
    }
    #envoyer:disabled { opacity: .4; cursor: not-allowed; }
    .note { text-align: center; color: var(--texte-doux); font-size: 12px; margin-top: 8px; }
  </style>
</head>

<body>
  <!-- ==================== 2. LA STRUCTURE (HTML) ==================== -->
  <header>
    <h1>Assistant <span>Atos</span></h1>
    <button id="nouvelle" type="button">+ Nouvelle conversation</button>
  </header>

  <main id="zone">
    <div id="conversation">
      <div id="accueil">
        <h2>Bonjour 👋</h2>
        <p>Je suis l'assistant commercial d'Atos. Posez-moi une question sur nos clients.</p>
        <div id="suggestions">
          <button type="button">Quel est le budget de Banque Horizon en dollars ?</button>
          <button type="button">Dans quelle ville est Energia Nord ?</button>
          <button type="button">Convertis 1000 euros en francs CFA</button>
          <button type="button">Quelle date sommes-nous ?</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <form id="formulaire">
      <textarea id="question" rows="1" placeholder="Posez votre question..." maxlength="2000"></textarea>
      <button id="envoyer" type="submit" title="Envoyer">➤</button>
    </form>
    <div class="note">Données clients fictives, pour la formation. L'IA peut se tromper.</div>
  </footer>

  <!-- ==================== 3. LE COMPORTEMENT (JavaScript) ==================== -->
  <script>
    // --- 3.1 Les éléments de la page dont on a besoin ---
    const conversation = document.getElementById("conversation");
    const zone = document.getElementById("zone");
    const formulaire = document.getElementById("formulaire");
    const champ = document.getElementById("question");
    const boutonEnvoyer = document.getElementById("envoyer");
    const accueil = document.getElementById("accueil");

    // --- 3.2 L'historique de la conversation (renvoyé au serveur à chaque question) ---
    let historique = [];

    // --- 3.3 Mise en forme du texte ---
    // échapper : empêche qu'une réponse contenant du HTML soit exécutée (sécurité, faille XSS)
    function echapper(texte) {
      const div = document.createElement("div");
      div.textContent = texte;
      return div.innerHTML;
    }
    // mettreEnForme : **gras** et paragraphes, après avoir échappé le texte
    function mettreEnForme(texte) {
      return echapper(texte)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .split(/\n{2,}/)
        .map(paragraphe => "<p>" + paragraphe.replace(/\n/g, "<br>") + "</p>")
        .join("");
    }

    // --- 3.4 Afficher un message dans la page ---
    function afficherMessage(role, texte, outils = []) {
      accueil.style.display = "none";
      const div = document.createElement("div");
      div.className = "message " + role;

      let html = role === "user" ? "" : '<div class="avatar">A</div>';
      html += '<div class="bulle">' + mettreEnForme(texte);
      if (outils.length > 0) {
        html += '<div class="outils">';
        for (const o of outils) {
          html += "<details><summary>🔧 Outil utilisé : " + echapper(o.outil) + "</summary>"
               + "<pre>Arguments : " + echapper(JSON.stringify(o.arguments)) + "\n"
               + "Résultat  : " + echapper(o.resultat) + "</pre></details>";
        }
        html += "</div>";
      }
      html += "</div>";

      div.innerHTML = html;
      conversation.appendChild(div);
      zone.scrollTop = zone.scrollHeight;   // descendre en bas de la conversation
      return div;
    }

    function afficherPoints() {
      const div = afficherMessage("assistant", "");
      div.querySelector(".bulle").innerHTML = '<div class="points"><span></span><span></span><span></span></div>';
      return div;
    }

    // --- 3.5 Envoyer une question au serveur ---
    async function envoyer(question) {
      historique.push({ role: "user", content: question });
      afficherMessage("user", question);
      champ.value = "";
      ajusterHauteur();
      boutonEnvoyer.disabled = true;
      const attente = afficherPoints();

      try {
        const reponse = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ historique: historique })
        });
        const donnees = await reponse.json();
        attente.remove();

        if (!reponse.ok) {
          historique.pop();   // la question n'a pas eu de réponse : on la retire
          afficherMessage("assistant erreur", donnees.erreur || "Erreur inconnue.");
        } else {
          historique.push({ role: "assistant", content: donnees.reponse });
          afficherMessage("assistant", donnees.reponse, donnees.outils);
        }
      } catch (e) {
        attente.remove();
        historique.pop();
        afficherMessage("assistant erreur", "Impossible de joindre le serveur. Est-il démarré ?");
      }
      boutonEnvoyer.disabled = false;
      champ.focus();
    }

    // --- 3.6 Les événements (clics, touches) ---
    formulaire.addEventListener("submit", event => {
      event.preventDefault();               // empêche le rechargement de la page
      const question = champ.value.trim();
      if (question && !boutonEnvoyer.disabled) envoyer(question);
    });

    champ.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {   // Entrée = envoyer, Maj+Entrée = retour à la ligne
        event.preventDefault();
        formulaire.requestSubmit();
      }
    });

    function ajusterHauteur() {             // la zone de saisie grandit avec le texte
      champ.style.height = "auto";
      champ.style.height = champ.scrollHeight + "px";
    }
    champ.addEventListener("input", ajusterHauteur);

    document.querySelectorAll("#suggestions button").forEach(bouton =>
      bouton.addEventListener("click", () => envoyer(bouton.textContent)));

    document.getElementById("nouvelle").addEventListener("click", () => {
      historique = [];
      conversation.querySelectorAll(".message").forEach(m => m.remove());
      accueil.style.display = "";
      champ.focus();
    });

    champ.focus();
  </script>
</body>
</html>
